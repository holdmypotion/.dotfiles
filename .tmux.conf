unbind r
bind r source ~/.tmux.conf

set -g prefix C-s
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

setw -g mode-keys vi
set -g set-clipboard on
set -s copy-command "if [ -x /usr/bin/pbcopy ]; then /usr/bin/pbcopy; else $HOME/.local/bin/pbcopy --osc52-only; fi"
set-hook -g pane-set-clipboard "run-shell 'if [ -x /usr/bin/pbcopy ]; then tmux save-buffer - | /usr/bin/pbcopy; else tmux save-buffer - | $HOME/.local/bin/pbcopy --osc52-only; fi'"

set-option -g focus-events on
set -s escape-time 0

set -g default-terminal "$TERM"
set -ag terminal-overrides "$TERM:Tc"
set -ag terminal-overrides ",*:Ms=\\E]52;c%p1%.0s;%p2%s\\7"
# set -g xterm-keys on

set -s extended-keys on
set-option -g xterm-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',*:clipboard'
set-option -g allow-passthrough on

set -g status-right ""
set -g status-style "fg=#808080"
set -g status-left-style "fg=#708090"
set -g status-bg default
set -g status-position top
set -g status-interval 5

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-left-length 30

bind C-l send-keys 'C-l'

set-option -g history-limit 50000

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Smart pane switching with awareness of Vim splits
# Fast zero-fork /proc check on Linux (walks pane_pid -> children including nested `script -qf` inner PTYs); falls back to ps on macOS
is_vim='p=#{pane_pid}; if [ -d /proc/$p ]; then read -r ch1 < /proc/$p/task/$p/children 2>/dev/null; for c1 in $p $ch1; do read -r ch2 < /proc/$c1/task/$c1/children 2>/dev/null; for c2 in $c1 $ch2; do read -r st < /proc/$c2/stat 2>/dev/null || continue; case "$st" in *"("*vim*") "[!TXZ]*|*"("*view*") "[!TXZ]*|*"("fzf*") "[!TXZ]*) exit 0;; esac; done; done; exit 1; else ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$"; fi'
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell 'tmux set-environment -g PATH "$HOME/.local/bin:$HOME/.zshrc_public/.scripts:/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:$PATH"'
run '~/.tmux/plugins/tpm/tpm'

# bind -n C-k clear-history

## tmux-sessionizer
is_fzf='p=#{pane_pid}; if [ -d /proc/$p ]; then read -r ch1 < /proc/$p/task/$p/children 2>/dev/null; for c1 in $p $ch1; do read -r ch2 < /proc/$c1/task/$c1/children 2>/dev/null; for c2 in $c1 $ch2; do read -r st < /proc/$c2/stat 2>/dev/null || continue; case "$st" in *"("fzf*") "[!TXZ]*) exit 0;; esac; done; done; exit 1; else ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\S+\/)?fzf$"; fi'
bind-key -n 'C-f' if-shell "$is_fzf" 'send-keys C-f' 'run-shell "tmux neww ~/.local/bin/tsession"'
bind-key -r f run-shell "tmux neww ~/.local/bin/tsession"
bind-key -r M-h run-shell "tmux neww tsession -s 0"
bind-key -r M-t run-shell "tmux neww tsession -s 1"
bind-key -r M-n run-shell "tmux neww tsession -s 2"
bind-key -r M-s run-shell "tmux neww tsession -s 3"

## Zen Mode (centered layout)
bind-key Z run-shell "tmux-zen"
bind-key -n M-z run-shell "tmux-zen"
